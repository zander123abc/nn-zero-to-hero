name: Financial Command Pages

on:
  push:
    branches:
      - financial-command-pages
    paths:
      - "financial-command-app/**"
      - ".github/workflows/financial-command-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: financial-command-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Financial Command
        uses: actions/upload-pages-artifact@v3
        with:
          path: financial-command-app
      - name: Deploy Financial Command
        id: deployment
        uses: actions/deploy-pages@v4
