name: Deploy Financial Command

on:
  push:
    branches: [financial-command-app]
    paths:
      - 'financial-command/**'
      - '.github/workflows/financial-command-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: financial-command-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}financial-command/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static artifact
        run: |
          mkdir -p site/financial-command
          cat financial-command/source/index.html.gz.b64.* | tr -d '\n' | base64 -d | gzip -d > site/financial-command/index.html
          cp financial-command/sw.js site/financial-command/sw.js
          cp financial-command/version.json site/financial-command/version.json
          cp financial-command/manifest.webmanifest site/financial-command/manifest.webmanifest
          cp financial-command/icon.svg site/financial-command/icon.svg
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./financial-command/"><title>Financial Command</title><a href="./financial-command/">Open Financial Command</a>
          HTML
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
